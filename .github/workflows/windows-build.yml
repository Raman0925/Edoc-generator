name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q edoc launcher.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EDocGenerator --hidden-import pythoncom --hidden-import pywintypes --collect-submodules win32com launcher.py
      - name: Hash executable
        shell: pwsh
        run: (Get-FileHash dist/EDocGenerator.exe -Algorithm SHA256).Hash + '  EDocGenerator.exe' | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EDocGenerator-Windows
          path: |
            dist/EDocGenerator.exe
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EDocGenerator-Windows
          path: dist
      - name: Publish executable on version tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/EDocGenerator.exe dist/SHA256SUMS.txt --title "$RELEASE_TAG" --generate-notes
